<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Referrer-Policy" content="no-referrer">

  <title>Opening article…</title>
</head>

<body>
  <p>Opening the article, please wait…</p>

  <p>
    If nothing happens,
    <a id="fallback" href="https://seekingalpha.com/article/4886592-why-pfizer-remains-a-strong-buy-in-2026">
      click here
    </a>.
  </p>

  <script>
    const target =
      "https://seekingalpha.com/article/4886592-why-pfizer-remains-a-strong-buy-in-2026";

    const min = 400;
    const max = 800;
    const delay = Math.floor(Math.random() * (max - min + 1)) + min;

    setTimeout(() => {
      window.location.replace(target);
    }, delay);
  </script>
</body>
</html>
